<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found - RaYzZzLab</title>
<meta name="description" content="The page you were looking for could not be found on RaYzZzLab. It may have been moved, removed, or never existed.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

<div class="stage">
  <div class="statusbar">
    <div class="id"><span class="dot err"></span><span>ERROR · 404</span></div>
    <div id="clock">--:--:--</div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <div class="eyebrow">Not Found</div>
      <h1>Page not found</h1>
    </div>

    <div class="content">
      <p class="status-text">The page you're looking for doesn't exist or has been moved.</p>
      <div id="actionContainer">
        <a class="btn btn-primary" href="/">Go to Home Page</a>
      </div>
    </div>
  </div>
  <footer>Static site · No cookies · No external tracking</footer>
</div>

<script src="/assets/clock.js" defer></script>

</body>
</html>
