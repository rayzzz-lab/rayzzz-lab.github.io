<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="RaYzZzLab - Auth Callback">
<meta property="og:description" content="Authentication callback page for the RaYzZzLab app. This page verifies callback links and is not intended for direct browsing.">
<meta property="og:site_name" content="RaYzZzLab">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rayzzz-lab.github.io/callback">
<meta property="og:image" content="https://rayzzz-lab.github.io/assets/og-image.png">

<meta name="twitter:card" content="summary_large_image">

<meta name="referrer" content="strict-origin-when-cross-origin">

<link rel="canonical" href="https://rayzzz-lab.github.io/callback">

<body>

<div class="stage">
  <div class="statusbar">
    <div class="id"><span class="dot live" id="statusDot"></span><span id="statusRoute">AUTH · REDIRECT</span></div>
    <div id="clock">--:--:--</div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <div class="eyebrow" id="eyebrow">Authentication</div>
      <h1 id="panelTitle">Checking link...</h1>
    </div>

    <div class="content">
      <p class="status-text" id="statusText" role="status" aria-live="polite">Please wait...</p>

      <div id="actionContainer"></div>
    </div>
  </div>
  <footer>Static site · No cookies · No external tracking</footer>
</div>

<script src="/assets/clock.js" defer></script>
<script src="/assets/vendor/supabase.min.js" defer></script>
<script src="/assets/supabase-config.js" defer></script>
<script src="/assets/callback.js" defer></script>

</body>
